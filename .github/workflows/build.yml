name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ## Build native binaries for each target
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross: false
            artifact: yggdrasil-x86_64-linux-gnu

          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            artifact: yggdrasil-x86_64-linux-musl

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross: true
            artifact: yggdrasil-aarch64-linux-gnu

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            artifact: yggdrasil-aarch64-linux-musl

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: Revertron/Yggdrasil-ng
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cross (for cross-compilation)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary (native)
        if: '!matrix.cross'
        run: cargo build --release --features ckr --target ${{ matrix.target }}

      - name: Build binary (cross)
        if: matrix.cross
        run: cross build --release --features ckr --target ${{ matrix.target }}

      - name: Rename artifact
        run: |
          cp target/${{ matrix.target }}/release/yggdrasil ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # Publish GitHub Release with ELF files
  release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts/
        run: sha256sum yggdrasil-* > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/yggdrasil-x86_64-linux-gnu
            artifacts/yggdrasil-x86_64-linux-musl
            artifacts/yggdrasil-aarch64-linux-gnu
            artifacts/yggdrasil-aarch64-linux-musl
            artifacts/SHA256SUMS.txt

  ## Docker multi-arch images
  docker:
    name: Build & push Docker images
    needs: build-binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo (Dockerfile + entrypoint)
        uses: actions/checkout@v6

      - name: Download amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: yggdrasil-x86_64-linux-musl
          path: bin/amd64/

      - name: Download arm64 binary (musl — static, подходит для Alpine)
        uses: actions/download-artifact@v8
        with:
          name: yggdrasil-aarch64-linux-musl
          path: bin/arm64/

      - name: Rename binaries to uniform name
        run: |
          mv bin/amd64/yggdrasil-x86_64-linux-musl  bin/amd64/yggdrasil
          mv bin/arm64/yggdrasil-aarch64-linux-musl bin/arm64/yggdrasil
          chmod +x bin/amd64/yggdrasil bin/arm64/yggdrasil

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
